name: Inline JS syntax
description: >-
  node --check for .js files and inline <script> blocks of .html pages in the given directories —
  pages embedded into a binary never meet a browser in CI.
inputs:
  paths:
    description: Directories, separated by spaces or newlines.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        # shellcheck disable=SC2086 # paths are a word list
        "${{ github.action_path }}/../../bin/inline-js" $PATHS
