# GitLab CI templates: the same steps as the GitHub actions, run by the same bin/ scripts.
#
#   include:
#     - remote: https://raw.githubusercontent.com/Dmitry-Fedotov-Dev/ci/v1/gitlab/ci.yml
#     # or, from a mirror inside your GitLab (no internet needed):
#     # - project: tools/ci
#     #   ref: v1
#     #   file: gitlab/ci.yml
#
#   variables:
#     CIKIT_IMAGE: registry.example.com/tools/ci:v1   # only with a mirror of the image
#
#   go:
#     extends: .cikit-go
#
# Every template is a hidden job (its name starts with a dot): nothing runs until a job
# extends it. Settings are CIKIT_* variables; set them in the job, or globally.
#
# How a job gets the tools and scripts: every job runs in the cikit image
# (ghcr.io/dmitry-fedotov-dev/ci, built from this repository's Dockerfile), which has them all
# at pinned versions — nothing is downloaded per job, and the image tag is the version.
# A job given another image (CIKIT_GO_IMAGE: golang:1.24 to test with an exact Go) has no
# scripts, so before_script clones this repository at CIKIT_REF and installs git/python3 when
# the image lacks them. Either way the scripts' directory is in $CIKIT. A job that needs its
# own before_script keeps ours with:
#   before_script:
#     - !reference [.cikit, before_script]
#     - your commands

variables:
  CIKIT_IMAGE: ghcr.io/dmitry-fedotov-dev/ci:v1
  # Per-job images, all the cikit image by default. CIKIT_GO_IMAGE: golang:1.24 runs the tests
  # with exactly that Go (the cikit image has a current Go and GOTOOLCHAIN=auto). The tools
  # (govulncheck, gosec, golangci-lint, xk6) need a current Go: leave CIKIT_GO_TOOLS_IMAGE be.
  CIKIT_GO_IMAGE: $CIKIT_IMAGE
  CIKIT_GO_TOOLS_IMAGE: $CIKIT_IMAGE
  CIKIT_PYTHON_IMAGE: $CIKIT_IMAGE
  CIKIT_NODE_IMAGE: $CIKIT_IMAGE
  # since v1.1 runs bin/promtool, so it needs bash: the plain prom/prometheus image no longer fits
  CIKIT_PROMETHEUS_IMAGE: $CIKIT_IMAGE
  # Only for images without the scripts:
  CIKIT_URL: https://github.com/Dmitry-Fedotov-Dev/ci.git
  CIKIT_REF: v1

.cikit:
  before_script:
    - |
      # CIKIT_LOCAL: use a checkout that is already here (the selftest of this repository)
      cikit_pkgs() {
        missing=""
        for c in "$@"; do command -v "$c" >/dev/null || missing="$missing $c"; done
        [ -z "$missing" ] && return 0
        echo "installing:$missing"
        if command -v apt-get >/dev/null; then
          apt-get update -qq && apt-get install -yqq --no-install-recommends $missing ca-certificates >/dev/null
        elif command -v apk >/dev/null; then
          apk add --no-cache $missing >/dev/null
        else
          echo "no package manager to install$missing — use an image that has them"; return 1
        fi
      }
      if [ -n "${CIKIT_LOCAL:-}" ]; then
        CIKIT=$CIKIT_LOCAL
      elif [ -x "${CIKIT_HOME:-/opt/cikit}/bin/go-check" ]; then
        CIKIT=${CIKIT_HOME:-/opt/cikit} # the cikit image
      else
        cikit_pkgs git bash
        CIKIT=/tmp/cikit-$CI_JOB_ID
        rm -rf "$CIKIT"
        git -c advice.detachedHead=false clone -q --depth 1 --branch "$CIKIT_REF" "$CIKIT_URL" "$CIKIT"
      fi
      export CIKIT
      if [ -n "${CIKIT_LOCAL:-}" ]; then echo "cikit: local copy $CIKIT"
      elif [ -d "$CIKIT/.git" ]; then echo "cikit: $CIKIT_URL@$CIKIT_REF ($(git -C "$CIKIT" rev-parse --short HEAD))"
      else echo "cikit: image $CIKIT_IMAGE"; fi

# --- Go ---------------------------------------------------------------------------------------

.cikit-go-cache:
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/gomod
    GOCACHE: $CI_PROJECT_DIR/.cache/gobuild
  cache:
    key: cikit-go-$CI_JOB_NAME_SLUG
    paths: [.cache/gomod, .cache/gobuild]

# gofmt, go vet, go test. Test results go to the merge request (JUnit), coverage to the job.
.cikit-go:
  extends: [.cikit, .cikit-go-cache]
  image: $CIKIT_GO_IMAGE
  variables:
    CIKIT_GO_DIR: .
    CIKIT_GO_PACKAGES: ./...
    CIKIT_GO_TEST_FLAGS: -race -count=1
    CIKIT_GOFMT: "true"
  script:
    - |
      args="--dir $CIKIT_GO_DIR --junit go-test.xml --coverage coverage.out"
      [ "$CIKIT_GOFMT" = true ] || args="$args --no-gofmt"
      "$CIKIT/bin/go-check" $args --packages "$CIKIT_GO_PACKAGES" --test-flags "$CIKIT_GO_TEST_FLAGS"
  coverage: '/total coverage: (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    reports:
      junit: go-test.xml
    paths: [go-test.xml, coverage.out]
    expire_in: 2 weeks

# govulncheck (blocking) and gosec (findings in the merge request's Code Quality widget;
# blocking only with CIKIT_GOSEC_FAIL: "true").
.cikit-go-security:
  extends: [.cikit, .cikit-go-cache]
  image: $CIKIT_GO_TOOLS_IMAGE
  variables:
    CIKIT_GO_DIR: .
    CIKIT_GO_PACKAGES: ./...
    CIKIT_GOVULNCHECK: "true"
    CIKIT_GOSEC_FAIL: "false"
    CIKIT_GOSEC_ARGS: ""
    CIKIT_LANG: en
  script:
    - cikit_pkgs python3
    - |
      set -- --dir "$CIKIT_GO_DIR" --packages "$CIKIT_GO_PACKAGES" --gosec-args "$CIKIT_GOSEC_ARGS" \
        --lang "$CIKIT_LANG" --codequality gl-code-quality-report.json
      [ "$CIKIT_GOVULNCHECK" = true ] || set -- "$@" --no-govulncheck
      [ "$CIKIT_GOSEC_FAIL" != true ] || set -- "$@" --gosec-fail
      "$CIKIT/bin/go-security" "$@"
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    # expose_as allows no variables in paths, so gosec.json stays out: the Code Quality
    # report carries the same findings
    paths: [ci-summary.md]
    expose_as: gosec summary
    expire_in: 2 weeks

# golangci-lint (the project's .golangci.* or config/golangci.yml) → Code Quality widget.
#   CIKIT_LINT_NEW_FROM_REV: origin/$CI_DEFAULT_BRANCH — only issues new since the default
#   branch, to adopt the linter in an existing project (needs GIT_DEPTH: 0)
.cikit-go-lint:
  extends: [.cikit, .cikit-go-cache]
  image: $CIKIT_GO_TOOLS_IMAGE
  variables:
    CIKIT_GO_DIR: .
    CIKIT_LINT_CONFIG: ""
    CIKIT_LINT_NEW_FROM_REV: ""
    CIKIT_LINT_ARGS: ""
  script:
    - cikit_pkgs python3
    - |
      set -- --dir "$CIKIT_GO_DIR" --args "$CIKIT_LINT_ARGS" --codequality gl-code-quality-report.json
      [ -z "$CIKIT_LINT_CONFIG" ] || set -- "$@" --config "$CIKIT_LINT_CONFIG"
      [ -z "$CIKIT_LINT_NEW_FROM_REV" ] || set -- "$@" --new-from-rev "$CIKIT_LINT_NEW_FROM_REV"
      "$CIKIT/bin/go-lint" "$@"
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 2 weeks

# --- k6 ---------------------------------------------------------------------------------------

# A k6 binary with extensions, as an artifact for later jobs (needs: [k6]).
#   CIKIT_XK6_WITH: one extension per line, as xk6 --with takes them
#   (never name your variables K6_VERSION or XK6_*: xk6 reads those as its flags)
.cikit-xk6-build:
  extends: [.cikit, .cikit-go-cache]
  image: $CIKIT_GO_TOOLS_IMAGE
  variables:
    CIKIT_K6_RELEASE: "" # empty: VER_K6 from versions.env
    CIKIT_XK6_WITH: ""
    CIKIT_XK6_VERSION: "" # empty: VER_XK6 from versions.env
    CIKIT_K6_OUTPUT: bin/k6
  script:
    - '"$CIKIT/bin/xk6-build" --k6 "$CIKIT_K6_RELEASE" --with "$CIKIT_XK6_WITH" --xk6 "$CIKIT_XK6_VERSION" --output "$CIKIT_K6_OUTPUT"'
  artifacts:
    paths: [$CIKIT_K6_OUTPUT]
    expire_in: 1 week

# Markdown summary of k6 results, exposed in the merge request. Usually you call the script at
# the end of your own k6 job instead of a separate job:
#   after_script:
#     - !reference [.cikit, before_script]
#     - $CIKIT/bin/k6-summary functional reports --scenarios "a b"
# and publish reports/*.xml as artifacts:reports:junit — GitLab then shows each step as a test.
.cikit-k6-summary:
  extends: .cikit
  image: $CIKIT_PYTHON_IMAGE
  variables:
    CIKIT_K6_KIND: functional
    CIKIT_K6_REPORTS: reports
    CIKIT_K6_SCENARIOS: ""
    CIKIT_K6_TITLE: ""
    CIKIT_K6_NOTE: ""
    CIKIT_LANG: en
  script:
    - |
      "$CIKIT/bin/k6-summary" "$CIKIT_K6_KIND" "$CIKIT_K6_REPORTS" --scenarios "$CIKIT_K6_SCENARIOS" \
        --title "$CIKIT_K6_TITLE" --note "$CIKIT_K6_NOTE" --lang "$CIKIT_LANG"
  artifacts:
    when: always
    paths: [ci-summary.md]
    expose_as: k6 summary
    expire_in: 2 weeks

# --- web and monitoring -----------------------------------------------------------------------

# node --check for .js files and inline <script> in .html under CIKIT_JS_PATHS (space-separated).
.cikit-inline-js:
  extends: .cikit
  image: $CIKIT_NODE_IMAGE
  variables:
    CIKIT_JS_PATHS: ""
  script:
    - cikit_pkgs python3
    - '"$CIKIT/bin/inline-js" $CIKIT_JS_PATHS'

# promtool check config and rule unit tests (promtool from the cikit image).
.cikit-promtool:
  extends: .cikit
  image: $CIKIT_PROMETHEUS_IMAGE
  variables:
    CIKIT_PROM_DIR: monitoring/prometheus
    CIKIT_PROM_CONFIG: prometheus.yml
    CIKIT_PROM_RULE_TESTS: ""
    CIKIT_PROM_MOUNT: /etc/prometheus
  script:
    - |
      set -- --dir "$CIKIT_PROM_DIR" --rule-tests "$CIKIT_PROM_RULE_TESTS" --mount "$CIKIT_PROM_MOUNT"
      if [ -n "$CIKIT_PROM_CONFIG" ]; then set -- "$@" --config "$CIKIT_PROM_CONFIG"; else set -- "$@" --no-config; fi
      "$CIKIT/bin/promtool" "$@"

# Generated Grafana dashboards match their generators.
#   CIKIT_DASHBOARDS: "gen.py committed.json" pairs, space-separated
.cikit-dashboards-sync:
  extends: .cikit
  image: $CIKIT_PYTHON_IMAGE
  variables:
    CIKIT_DASHBOARDS: ""
  script:
    - '"$CIKIT/bin/dashboards-sync" $CIKIT_DASHBOARDS'
