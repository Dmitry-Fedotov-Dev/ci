# Starter CI for a Go project on GitHub: copy to .github/workflows/ci.yml and delete what you
# do not need. Every step is documented in https://github.com/Dmitry-Fedotov-Dev/ci.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    uses: Dmitry-Fedotov-Dev/ci/.github/workflows/go.yml@v1
    with:
      test-flags: -race -count=1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for new-from-rev
      - uses: Dmitry-Fedotov-Dev/ci/actions/go-lint@v1
        # with:
        #   new-from-rev: origin/main # an existing project: new issues only

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Dmitry-Fedotov-Dev/ci/actions/go-security@v1
        # with:
        #   gosec-args: -exclude=G115

