# The CI repository tests itself before every release: each workflow and action runs against
# testdata/, and the failure paths are checked to really fail. When everything passes on main,
# next or v1, the cikit image is published as ghcr.io/dmitry-fedotov-dev/ci:<branch>.
name: selftest

on:
  push: # every branch: a release candidate is tested on its own branch before main
  pull_request:
  schedule:
    # weekly: rebuild the image on v1 with the latest Go patch release — govulncheck reports
    # the stdlib of the Go it runs with, so a stale image would flag long-fixed vulnerabilities
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  go:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/gomod
      test-flags: -race -count=2

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lint workflows and actions
        run: |
          . versions.env
          go install "github.com/rhysd/actionlint/cmd/actionlint@$VER_ACTIONLINT"
          "$(go env GOPATH)/bin/actionlint"

      - uses: ./actions/xk6-build
        id: k6
        with:
          with: github.com/Dmitry-Fedotov-Dev/xk6-sip@v0.4.0
          output: build/k6
      - name: k6 has xk6-sip
        run: ${{ steps.k6.outputs.path }} version | grep -i sip

      - uses: ./actions/k6-summary
        with:
          kind: functional
          reports: testdata/reports
          scenarios: pass fail
          output: /tmp/functional.md
      - name: functional summary is right
        run: |
          grep -q "1 of 2 scenarios failed" /tmp/functional.md
          grep -q "peer heard" /tmp/functional.md

      - uses: ./actions/k6-summary
        with:
          kind: load
          reports: testdata/reports/summary.json
          title: selftest load
          lang: ru
          output: /tmp/load.md
      - name: load summary is right
        run: |
          grep -q "пробито 1 из 6 порогов" /tmp/load.md
          grep -q "kontakt_peer_heard" /tmp/load.md

      - uses: ./actions/inline-js
        with:
          paths: testdata/web
      - name: inline-js catches a syntax error
        run: |
          mkdir -p /tmp/bad && echo '<script>const = ;</script>' > /tmp/bad/p.html
          if python3 scripts/check_js.py /tmp/bad; then echo "::error::bad JS passed"; exit 1; fi

      - uses: ./actions/promtool
        with:
          dir: testdata/prometheus
          rule-tests: tests/app_test.yml

      - uses: ./actions/dashboards-sync
        with:
          pairs: testdata/grafana/gen.py testdata/grafana/selftest.json
      - name: dashboards-sync catches drift
        run: |
          echo '{}' > /tmp/drift.json
          if python3 - <<'PY'
          import subprocess, sys
          r = subprocess.run(["bash", "-c", "python3 testdata/grafana/gen.py /tmp/g.json && diff -q /tmp/g.json /tmp/drift.json"])
          sys.exit(0 if r.returncode else 1)
          PY
          then echo "drift detected"; else echo "::error::drift not detected"; exit 1; fi

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: git ls-files -z bin lib | xargs -0 shellcheck
      - name: bin/ checks fail when they should
        run: |
          fails() { if "$@" >/dev/null 2>&1; then echo "::error::passed but must fail: $*"; exit 1; fi; }
          echo '{}' > /tmp/drift.json
          fails bin/dashboards-sync testdata/grafana/gen.py /tmp/drift.json
          fails bin/k6-summary bogus testdata/reports
          fails bin/xk6-build --k6 v2.3.0
          fails bin/go-check --no-such-flag

  # The GitLab templates, run by gitlab-ci-local in Docker with the real images: the same
  # selftest a GitLab mirror of this repository runs (.gitlab-ci.yml).
  gitlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build the cikit image from this commit
        run: docker build -t cikit:test .
      - name: gitlab-ci-local
        run: |
          . versions.env
          npm install -g "gitlab-ci-local@$VER_GITLAB_CI_LOCAL"
          git remote set-head origin --auto || true
          gitlab-ci-local --concurrency 4 --variable CIKIT_IMAGE=cikit:test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/go-lint
        with:
          working-directory: testdata/gomod
      - name: go-lint catches a lint error
        run: |
          if bin/go-lint --dir testdata/golint; then echo "::error::lint error passed"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/go-security
        with:
          working-directory: testdata/gomod
      - name: gosec report exists
        run: test -f testdata/gomod/gosec.json

  image:
    needs: [go, actions, scripts, gitlab, lint, security]
    if: >-
      github.event_name == 'schedule' || (github.event_name != 'pull_request' &&
      contains(fromJSON('["main", "next", "v1"]'), github.ref_name))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'schedule' && 'v1' || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'v1' || github.ref }}
      - name: build and push ghcr.io/${{ github.repository }}:${{ env.TAG }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$TAG" -t "$image:sha-$(git rev-parse --short HEAD)" .
          docker run --rm "$image:$TAG" bash -c 'test -x /opt/cikit/bin/go-check && govulncheck -version && golangci-lint --version'
          docker push "$image:$TAG"
          docker push "$image:sha-$(git rev-parse --short HEAD)"
          echo "### Image: \`$image:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

