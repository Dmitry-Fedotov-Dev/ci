# The CI repository tests itself before every release: each workflow and action runs against
# testdata/, and the failure paths are checked to really fail.
name: selftest

on:
  push: # every branch: a release candidate is tested on its own branch before main
  pull_request:

jobs:
  go:
    uses: ./.github/workflows/go.yml
    with:
      working-directory: testdata/gomod
      test-flags: -race -count=2

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lint workflows and actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

      - uses: ./actions/xk6-build
        id: k6
        with:
          with: github.com/Dmitry-Fedotov-Dev/xk6-sip@v0.4.0
      - name: k6 has xk6-sip
        run: ${{ steps.k6.outputs.path }} version | grep -i sip

      - uses: ./actions/k6-summary
        with:
          kind: functional
          reports: testdata/reports
          scenarios: pass fail
          output: /tmp/functional.md
      - name: functional summary is right
        run: |
          grep -q "1 of 2 scenarios failed" /tmp/functional.md
          grep -q "peer heard" /tmp/functional.md

      - uses: ./actions/k6-summary
        with:
          kind: load
          reports: testdata/reports/summary.json
          title: selftest load
          lang: ru
          output: /tmp/load.md
      - name: load summary is right
        run: |
          grep -q "пробито 1 из 6 порогов" /tmp/load.md
          grep -q "kontakt_peer_heard" /tmp/load.md

      - uses: ./actions/inline-js
        with:
          paths: testdata/web
      - name: inline-js catches a syntax error
        run: |
          mkdir -p /tmp/bad && echo '<script>const = ;</script>' > /tmp/bad/p.html
          if python3 scripts/check_js.py /tmp/bad; then echo "::error::bad JS passed"; exit 1; fi

      - uses: ./actions/promtool
        with:
          dir: testdata/prometheus
          rule-tests: tests/app_test.yml

      - uses: ./actions/dashboards-sync
        with:
          pairs: testdata/grafana/gen.py testdata/grafana/selftest.json
      - name: dashboards-sync catches drift
        run: |
          echo '{}' > /tmp/drift.json
          if python3 - <<'PY'
          import subprocess, sys
          r = subprocess.run(["bash", "-c", "python3 testdata/grafana/gen.py /tmp/g.json && diff -q /tmp/g.json /tmp/drift.json"])
          sys.exit(0 if r.returncode else 1)
          PY
          then echo "drift detected"; else echo "::error::drift not detected"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./actions/go-security
        with:
          working-directory: testdata/gomod
      - name: gosec report exists
        run: test -f testdata/gomod/gosec.json
